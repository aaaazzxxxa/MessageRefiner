<div id="gct-settings" class="gct-settings">
  <div class="inline-drawer">
    <div class="inline-drawer-toggle inline-drawer-header">
      <div class="gct-settings-title">
        <img src="{{iconPath}}" alt="" class="gct-settings-icon">
        <b>개떡찰떡</b>
      </div>
      <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
    </div>
    <div class="inline-drawer-content">
      <label class="checkbox_label gct-visible-toggle" for="gct-widget-visible">
        <input id="gct-widget-visible" type="checkbox">
        <span>입력창 위 개떡찰떡 탭 ON/OFF</span>
      </label>
      <small class="gct-settings-note">탭의 X로 숨긴 뒤에도 여기서 다시 켤 수 있습니다.</small>

      <label for="gct-connection-profile"><b>연결 프로필</b></label>
      <select id="gct-connection-profile" class="text_pole">
        <option value="">현재 SillyTavern 연결 사용</option>
      </select>
      <small class="gct-settings-note">선택한 프로필로 후처리 요청만 따로 보냅니다. 비워두면 현재 연결 설정을 그대로 사용합니다.</small>

      <div class="gct-debug-header">
        <b>디버그 로그</b>
        <div class="gct-debug-actions">
          <button type="button" class="menu_button" id="gct-copy-debug">복사</button>
          <button type="button" class="menu_button" id="gct-clear-debug">비우기</button>
        </div>
      </div>
      <textarea id="gct-debug-log" class="text_pole" rows="10" readonly placeholder="이번 세션의 요청과 오류가 여기에 기록됩니다."></textarea>
      <small class="gct-settings-note">원문·프롬프트·결과가 포함될 수 있으며 현재 브라우저 세션에만 보관됩니다.</small>
    </div>
  </div>
</div>
